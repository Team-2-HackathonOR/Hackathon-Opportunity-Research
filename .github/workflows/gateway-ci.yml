name: project-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node-${{ matrix.node }} / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        component: [gateway, jwt-service, services/hackathon-service, scraper, hackscout-gateway]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
      - run: npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [ETL, services/mail-service]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
      MONGODB_CONNECTION_STRING: mongodb://127.0.0.1:27017
      GATEWAY_INTERNAL_SECRET: only-a-synthetic-test-secret
      AI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  edge-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hackscout-gateway/package-lock.json
      - run: npm ci
      - run: npm ci --prefix hackscout-gateway
      - run: node --test tests/runtime/harness.test.cjs
      - run: npm run test:sql
      - run: npm run test:edge
      - name: Check disposable Edge bootstrap
        run: node node_modules/deno/bin.cjs check --no-lock --node-modules-dir=none --config tests/runtime/deno.json tests/runtime/edge-bootstrap.ts

  api:
    needs: [node, python, edge-and-schema]
    uses: ./.github/workflows/runtime-ci.yml
    with:
      suite: api

  browser:
    needs: api
    uses: ./.github/workflows/runtime-ci.yml
    with:
      suite: browser

  required:
    if: always()
    needs: [node, python, edge-and-schema, api, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test tier
        env:
          NODE: ${{ needs.node.result }}
          PYTHON: ${{ needs.python.result }}
          EDGE: ${{ needs.edge-and-schema.result }}
          API: ${{ needs.api.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          for result in "$NODE" "$PYTHON" "$EDGE" "$API" "$BROWSER"; do
            if [ "$result" != success ]; then
              echo "A required test tier failed, was cancelled, or was skipped."
              exit 1
            fi
          done
